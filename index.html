<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#15130f" />
    <meta
      name="description"
      content="The Ashen Standard — an original first-person action RPG set in Gascony, 1356."
    />
    <link rel="icon" href="data:," />
    <title>The Ashen Standard</title>
  </head>
  <body>
    <main id="game" aria-label="The Ashen Standard game">
      <canvas id="game-canvas" tabindex="0" aria-label="The Ashen Standard first-person game view"></canvas>

      <div id="game-hud" class="hud" aria-hidden="true" hidden>
        <div class="vignette"></div>
        <div class="crosshair"><span></span><span></span></div>
        <div class="stance">
          <span id="stance-label">READY</span>
        </div>
      </div>

      <section id="game-menu" class="menu" aria-live="polite">
        <div class="menu__crest" aria-hidden="true">AS</div>
        <p class="menu__eyebrow">GASCONY · 1356</p>
        <h1>THE ASHEN<br />STANDARD</h1>
        <p id="menu-message" class="menu__message">
          The vanguard is breaking at Saint-Orens Ford.
        </p>
        <button id="enter-game" type="button">Take up the standard</button>
        <div class="menu__controls">
          <span><kbd>WASD</kbd> Move</span>
          <span><kbd>Shift</kbd> Sprint</span>
          <span><kbd>Space</kbd> Jump</span>
          <span><kbd>C</kbd> Crouch</span>
          <span><kbd>Mouse</kbd> Look</span>
          <span><kbd>LMB</kbd> Attack</span>
          <span><kbd>RMB</kbd> Guard</span>
          <span><kbd>E</kbd> Interact</span>
          <span><kbd>Alt</kbd> Backstep</span>
          <span><kbd>Q/R/F</kbd> Command</span>
          <span><kbd>Esc</kbd> Pause</span>
        </div>
      </section>

      <div id="loading-status" class="loading-status">Muster the field…</div>
      <div id="fatal-error" class="fatal-error" hidden></div>
    </main>
    <noscript>This game requires JavaScript and WebGL.</noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
